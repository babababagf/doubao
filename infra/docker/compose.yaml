name: doubaohk-local

services:
  postgres:
    image: postgres:17-alpine
    container_name: doubaohk-postgres
    environment:
      POSTGRES_DB: doubaohk
      POSTGRES_USER: doubaohk
      POSTGRES_PASSWORD: doubaohk_local_only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - doubaohk_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U doubaohk -d doubaohk']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    container_name: doubaohk-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6470:6379'
    volumes:
      - doubaohk_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  doubaohk_postgres:
  doubaohk_redis:
